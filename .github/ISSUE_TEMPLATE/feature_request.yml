name: Feature request
description: Something Keryx could show, or show better
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to see
      description: What question about your Hermes install would this answer?
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where Hermes records it
      description: Keryx only reads what Hermes already writes (state.db, cron store, logs, gateway_state.json…). If you know which file or table carries the data, say so.
  - type: checkboxes
    id: readonly
    attributes:
      label: Read-only
      options:
        - label: This does not require Keryx to write to Hermes' data or call the agent.
          required: true
